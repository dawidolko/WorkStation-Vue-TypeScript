<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WorkStation">
  <!--
    Replaces a PNG that carried an opaque near-white background, which showed as
    a white tile in dark browser tab bars. A transparent SVG adapts to whatever
    chrome the browser paints behind it and stays sharp at any density.
  -->
  <defs>
    <linearGradient id="wsRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b7089"/>
      <stop offset="100%" style="stop-color:#3d4d61"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#wsRing)" stroke-width="7"/>
  <!-- Gamepad body -->
  <path d="M22 26h20a9 9 0 0 1 9 9v2a6 6 0 0 1-10.5 4l-2.5-2.5h-12L23.5 41A6 6 0 0 1 13 37v-2a9 9 0 0 1 9-9z" fill="#1f2b3a"/>
  <!-- D-pad -->
  <g fill="#ffffff">
    <rect x="19" y="32" width="9" height="3" rx="1.5"/>
    <rect x="22" y="29" width="3" height="9" rx="1.5"/>
  </g>
  <!-- Action buttons -->
  <g fill="#ff6b5b">
    <circle cx="41" cy="31" r="2.3"/>
    <circle cx="45.5" cy="34" r="2.3"/>
    <circle cx="41" cy="37" r="2.3"/>
  </g>
</svg>
